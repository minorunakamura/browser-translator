<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Browser Translator の設定</title>
    <style>
      :root {
        --bg: #f8f9fa;
        --card: #fff;
        --text: #202124;
        --secondary: #5f6368;
        --divider: #dadce0;
        --accent: #1a73e8;
        --on-accent: #fff;
        --field: #f1f3f4;
        --shadow: 0 1px 2px rgb(60 64 67 / 30%), 0 1px 3px 1px rgb(60 64 67 / 15%);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #202124;
          --card: #292a2d;
          --text: #e8eaed;
          --secondary: #9aa0a6;
          --divider: #3c4043;
          --accent: #8ab4f8;
          --on-accent: #202124;
          --field: #202124;
          --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 1px 3px 1px rgb(0 0 0 / 15%);
        }
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        accent-color: var(--accent);
      }
      h1 { max-width: 640px; margin: 0 auto 12px; font-size: 15px; font-weight: 500; }
      form {
        max-width: 640px;
        margin: 0 auto;
        background: var(--card);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }
      .row { padding: 12px 20px; border-top: 1px solid var(--divider); }
      .row:first-child { border-top: none; }
      .row > label, legend { display: block; margin-bottom: 6px; font-weight: 500; }
      fieldset { margin: 0; border: none; padding: 0; min-width: 0; }
      /* float keeps the legend inside the row instead of on the row's top border */
      legend { float: left; width: 100%; padding: 0; }
      fieldset label { clear: both; display: flex; gap: 8px; align-items: flex-start; margin-top: 4px; }
      fieldset input { margin: 3px 0 0; flex: none; }
      input[type="url"], select, textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid var(--divider);
        border-radius: 4px;
        background: var(--field);
        color: inherit;
        font: inherit;
      }
      input[type="url"]:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
      }
      textarea { resize: vertical; }
      button {
        margin-top: 8px;
        padding: 6px 16px;
        border: 1px solid var(--divider);
        border-radius: 4px;
        background: transparent;
        color: var(--accent);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
      button[type="submit"] { margin-top: 0; border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
      button[type="submit"]:hover { background: color-mix(in srgb, var(--accent) 90%, var(--text)); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .note { margin: 6px 0 0; color: var(--secondary); font-size: 12px; }
      #models-status, #save-status { margin-left: 8px; color: var(--secondary); }
    </style>
  </head>
  <body>
    <h1>Browser Translator の設定</h1>
    <form id="settings">
      <div class="row">
        <label for="url">llama-server の URL</label>
        <input id="url" type="url" required />
        <button id="reload-models" type="button">モデルの一覧を取り直す</button>
        <span id="models-status"></span>
      </div>

      <div class="row">
        <label for="model">モデル</label>
        <select id="model"></select>
      </div>

      <fieldset class="row">
        <legend>送り方</legend>
        <label><input type="radio" name="mode" value="parallel" /> 並列（前後の段落の原文を参考に、同時に送る）</label>
        <label><input type="radio" name="mode" value="serial" /> 直列（直前の段落の原文と訳文を翻訳履歴として、順に送る）</label>
      </fieldset>

      <div class="row">
        <label for="glossary">用語集</label>
        <textarea id="glossary" rows="8" placeholder="agent harness = エージェント基盤"></textarea>
        <p class="note">1 行に 1 語、「原語 = 訳語」と書く。段落にその語（大文字小文字は区別しない、語の区切りで照合）があるときだけ送る。</p>
      </div>

      <div class="row">
        <button type="submit">保存</button>
        <span id="save-status"></span>
      </div>
    </form>
    <script src="options.js"></script>
  </body>
</html>
